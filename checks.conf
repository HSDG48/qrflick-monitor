# QRflick external checks. One per line:
#   name | method | url | expected status | expectation | max seconds
# expectation: "location=<exact Location header>", "body=<text the page must contain>" or "-".
# Short links use HEAD: the app records no scan for HEAD requests, so analytics stay clean.
# Codes 7TursRA, Bf6pLds and mXN49mw are dedicated monitoring codes (folder "Monitoring").

health        | GET  | https://qrflick.com/up                           | 200 | -                                                   | 3
login-page    | GET  | https://qrflick.com/login                        | 200 | body=password                                       | 3
link-external | HEAD | https://qrflick.com/7TursRA                      | 302 | location=https://example.com/                       | 3
link-iana     | HEAD | https://qrflick.com/Bf6pLds                      | 302 | location=https://www.iana.org/help/example-domains  | 3
link-hosted   | HEAD | https://qrflick.com/mXN49mw                      | 302 | location=https://pages.qrflick.com/q/link_bio/mXN49mw | 3
hosted-page   | GET  | https://pages.qrflick.com/q/link_bio/mXN49mw     | 200 | body=QRflick monitor                                | 4
